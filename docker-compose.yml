services:
  accounting-app:
    container_name: accounting-service
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    working_dir: /var/www/html/accounting-service
    restart: unless-stopped
    ports:
      - "4005:4005"
    env_file:
      - ./.env
    environment:
      PORT: 4005
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-true}
      ACCOUNTING_ENABLE_SEED: ${ACCOUNTING_ENABLE_SEED:-true}
      AUTH_SERVICE_BASE_URL: http://authservice-nginx/api/v1
      SHIPPING_SERVICE_BASE_URL: ${SHIPPING_SERVICE_BASE_URL:-http://shippingservice-nginx/shipping}
      DATABASE_URL: postgresql://postgres:postgres@accounting-db:5432/accounting_service?schema=public
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-order_events}
      RABBITMQ_PAYMENT_COMPLETED_KEY: ${RABBITMQ_PAYMENT_COMPLETED_KEY:-payment.completed}
      RABBITMQ_PAYMENT_COLLECTED_KEY: ${RABBITMQ_PAYMENT_COLLECTED_KEY:-payment.collected}
      RABBITMQ_ORDER_PAID_KEY: ${RABBITMQ_ORDER_PAID_KEY:-order.paid}
      RABBITMQ_PAYMENT_QUEUE: ${RABBITMQ_PAYMENT_QUEUE:-accounting.payment_completed}
      RABBITMQ_PAYMENT_DLQ: ${RABBITMQ_PAYMENT_DLQ:-accounting.payment_completed.dlq}
      ACCOUNTING_EVENTS_EXCHANGE: ${ACCOUNTING_EVENTS_EXCHANGE:-accounting.events}
      ACCOUNTING_JOURNAL_ENTRY_ROUTING_KEY: ${ACCOUNTING_JOURNAL_ENTRY_ROUTING_KEY:-accounting.journal-entry.upserted}
    depends_on:
      accounting-db:
        condition: service_started
    networks:
      - accounting-network
      - itv-network

  accounting-db:
    image: postgres:16
    container_name: accounting-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: accounting_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - accounting_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accounting_service"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - accounting-network

volumes:
  accounting_pg_data:

networks:
  accounting-network:
    driver: bridge
  itv-network:
    external: true
    name: itv-network
