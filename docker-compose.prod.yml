name: accounting-service-prod

services:
  accounting-app:
    image: itvmicroservicesteam/accounting-service:${IMAGE_TAG:-latest}
    container_name: ${APP_CONTAINER_NAME}
    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      PORT: 4005
      DATABASE_URL: ${DATABASE_URL}
      ORDER_SERVICE_API_KEY: ${ORDER_SERVICE_API_KEY:?ORDER_SERVICE_API_KEY must be set}
      SHIPPING_SERVICE_BASE_URL: ${SHIPPING_SERVICE_BASE_URL:-http://shippingservice-nginx/shipping}

      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_PAYMENT_COMPLETED_KEY: ${RABBITMQ_PAYMENT_COMPLETED_KEY}
      RABBITMQ_PAYMENT_COLLECTED_KEY: ${RABBITMQ_PAYMENT_COLLECTED_KEY}
      RABBITMQ_ORDER_PAID_KEY: ${RABBITMQ_ORDER_PAID_KEY}
      RABBITMQ_ORDER_RETURNED_KEY: ${RABBITMQ_ORDER_RETURNED_KEY:-order.returned}
      RABBITMQ_ORDER_RETURNED_QUEUE: ${RABBITMQ_ORDER_RETURNED_QUEUE:-accounting.order_returned}
      RABBITMQ_ORDER_RETURNED_DLQ: ${RABBITMQ_ORDER_RETURNED_DLQ:-accounting.order_returned.dlq}
      RABBITMQ_PAYMENT_QUEUE: ${RABBITMQ_PAYMENT_QUEUE}
      RABBITMQ_PAYMENT_DLQ: ${RABBITMQ_PAYMENT_DLQ}
      RABBITMQ_INVOICE_GENERATED_KEY: ${RABBITMQ_INVOICE_GENERATED_KEY:-invoice.generated}
      RABBITMQ_INVOICE_PAID_KEY: ${RABBITMQ_INVOICE_PAID_KEY:-invoice.paid}
      RABBITMQ_INVOICE_PROJECTION_QUEUE: ${RABBITMQ_INVOICE_PROJECTION_QUEUE:-accounting.invoice_projection}
      RABBITMQ_INVOICE_PROJECTION_DLQ: ${RABBITMQ_INVOICE_PROJECTION_DLQ:-accounting.invoice_projection.dlq}
      RABBITMQ_INVOICE_PROJECTION_RETRY_QUEUE: ${RABBITMQ_INVOICE_PROJECTION_RETRY_QUEUE:-accounting.invoice_projection.retry_queue}
      RABBITMQ_INVOICE_PROJECTION_RETRY_DELAY_MS: ${RABBITMQ_INVOICE_PROJECTION_RETRY_DELAY_MS:-5000}
      RABBITMQ_INVOICE_PROJECTION_MAX_RETRIES: ${RABBITMQ_INVOICE_PROJECTION_MAX_RETRIES:-5}

      ACCOUNTING_EVENTS_EXCHANGE: ${ACCOUNTING_EVENTS_EXCHANGE:-accounting.events}
      ACCOUNTING_JOURNAL_ENTRY_ROUTING_KEY: ${ACCOUNTING_JOURNAL_ENTRY_ROUTING_KEY:-accounting.journal-entry.upserted}

      AUTH_SERVICE_BASE_URL: ${AUTH_SERVICE_BASE_URL}

    ports:
      - "127.0.0.1:${PORT:-4005}:4005"

    networks:
      - app-network

    depends_on:
      accounting-db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4005/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp

  accounting-db:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - accounting-postgres-data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    networks:
      - app-network

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

volumes:
  accounting-postgres-data:
    name: ${POSTGRES_VOLUME_NAME}

networks:
  app-network:
    external: true
    name: ${NETWORK_NAME}